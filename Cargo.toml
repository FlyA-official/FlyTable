[workspace]
resolver = "3"
members = [
    "crates/flytable-core",
    "crates/flytable-event",
    "crates/flytable-protocol",
    "crates/flytable-maintainer",
    "crates/flytable-table",
    "crates/flytable-seat",
    "crates/flytable-cli",
    "crates/flytable-inference-host",
    "crates/flytable-runtime",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.96"

[workspace.dependencies]
# Workspace crates
flytable-core = { path = "crates/flytable-core" }
flytable-event = { path = "crates/flytable-event" }
flytable-protocol = { path = "crates/flytable-protocol" }
flytable-maintainer = { path = "crates/flytable-maintainer" }
flytable-table = { path = "crates/flytable-table" }
flytable-seat = { path = "crates/flytable-seat" }
flytable-inference-host = { path = "crates/flytable-inference-host" }
flytable-runtime = { path = "crates/flytable-runtime" }

# External dependencies. The rule crates stay offline, with no network or model dependencies.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
rand = "0.8"
rand_chacha = "0.3"
clap = { version = "4", features = ["derive"] }
# Only used by flytable-inference-host (and the runtime above it), never by the rule crates.
anyhow = "1"
sha2 = "0.10"
toml = "=0.8.23"
time = { version = "0.3", features = ["formatting"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }

[profile.release]
lto = "thin"
